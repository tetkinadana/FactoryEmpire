<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Factory Empire</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        FACTORY EMPIRE
    </div>

    <button class="settings-button" onclick="openModal('settingsModal')">
        ⚙
    </button>

    <div class="level">
        УРОВЕНЬ <span id="playerLevel">1</span>
    </div>

</header>


<!-- РЕСУРСЫ -->

<section class="resources">

    <div class="resource">
        💰
        <span id="money">0</span>
    </div>

    <div class="resource">
        🪨
        <span id="ore">0</span>
    </div>

    <div class="resource">
        🔩
        <span id="metal">0</span>
    </div>

    <div class="resource">
        ⚙
        <span id="parts">0</span>
    </div>

</section>


<!-- XP -->

<section class="xp-section">

    <div class="xp-text">

        XP:
        <span id="xp">0</span>
        /
        <span id="xpNeeded">100</span>

    </div>

    <div class="xp-bar">

        <div id="xpFill"></div>

    </div>

</section>


<div id="levelMessage" class="level-message"></div>


<!-- ГЛАВНЫЙ ЭКРАН -->

<main id="mainScreen">

    <section class="mine-panel">

        <div class="mine-icon">
            ⛏
        </div>

        <h1>
            ШАХТА
        </h1>

        <div class="automatic">

            Автоматически:
            <b id="autoMining">0.1</b>
            руды / сек

        </div>

        <div class="manual">

            Ручная добыча:
            <b id="manualMining">+0.1</b>
            руды

        </div>

        <button class="mine-button" onclick="mine()">

            ⛏ ДОБЫТЬ РУДУ

        </button>

        <div class="mine-level">

            Уровень шахты:
            <b id="mineLevel">1</b>

        </div>

    </section>


    <!-- КНОПКИ -->

    <section class="action-grid">

        <button class="action-card" onclick="sellParts()">

            <span>⇢</span>

            <b>
                СБЫТ
            </b>

            <small>
                Продать детали
            </small>

        </button>


        <button class="action-card" onclick="openModal('buildingsModal')">

            <span>▦</span>

            <b>
                ЗДАНИЯ
            </b>

            <small>
                Производство
            </small>

        </button>


        <button class="action-card" onclick="openModal('workersModal')">

            <span>👷</span>

            <b>
                РАБОЧИЕ
            </b>

            <small>
                Персонал
            </small>

        </button>


        <button class="action-card" onclick="openModal('upgradeModal')">

            <span>⚙</span>

            <b>
                УЛУЧШЕНИЯ
            </b>

            <small>
                Развитие
            </small>

        </button>

    </section>


    <!-- КРАТКАЯ ИНФОРМАЦИЯ -->

    <section class="summary-grid">

        <div class="summary-card">

            <span>
                Руда
            </span>

            <b id="summaryOre">
                0
            </b>

        </div>


        <div class="summary-card">

            <span>
                Металл
            </span>

            <b id="summaryMetal">
                0
            </b>

        </div>


        <div class="summary-card">

            <span>
                Детали
            </span>

            <b id="summaryParts">
                0
            </b>

        </div>


        <div class="summary-card">

            <span>
                Рабочие
            </span>

            <b id="summaryWorkers">
                0
            </b>

        </div>

    </section>

</
